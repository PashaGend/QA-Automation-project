services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./docker/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./supabase/migrations/0001_init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3000:3000'

  gateway:
    image: nginx:alpine
    depends_on:
      - rest
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8000:80'

  web:
    # cloning only this repo? `docker compose pull web` grabs this prebuilt
    # image instead of needing ../Mondial2026 at all. Have both repos and want
    # your own local edits reflected? `docker compose build web` uses the
    # block below instead, same as it always has.
    image: ghcr.io/pashagend/mundial2026-web:latest
    build:
      context: ../Mondial2026
      dockerfile: ../mundial-qa-automation/docker/Dockerfile.app
      args:
        VITE_SUPABASE_URL: http://localhost:8000
        VITE_SUPABASE_ANON_KEY: ${ANON_JWT}
    depends_on:
      - gateway
    ports:
      - '8080:80'

  tests:
    image: mcr.microsoft.com/playwright:v1.64.1-jammy
    profiles: ['tests']
    working_dir: /work
    volumes:
      - .:/work
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      web:
        condition: service_started
    environment:
      # network_mode: host means "localhost" here is the same host the app's
      # own baked-in VITE_SUPABASE_URL (http://localhost:8000) resolves to —
      # otherwise the browser running inside this container would try to reach
      # "localhost" meaning itself, not the gateway container.
      SUPABASE_URL: http://localhost:3000
      REST_URL: http://localhost:3000
      SUPABASE_ANON_KEY: ${ANON_JWT}
      DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@localhost:55432/postgres
      BASE_URL: http://localhost:8080
    command: sh -c "npm ci && npx playwright test"
