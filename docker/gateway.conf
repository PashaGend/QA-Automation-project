# Mimics the one thing Supabase's Kong gateway does that our app's
# @supabase/supabase-js client relies on: it always calls /rest/v1/*,
# but plain PostgREST serves routes at the root with no prefix.
server {
  listen 80;

  location /rest/v1/ {
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://rest:3000;
    proxy_set_header Host $host;
  }
}
