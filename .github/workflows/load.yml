name: Load Test
on:
  schedule:
    - cron: '0 3 * * *' # once a day
  workflow_dispatch: # lets you trigger it manually from the Actions tab too

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start db, rest
        run: docker compose --env-file .env.docker up -d --build db rest

      - name: Run load test
        run: docker compose --env-file .env.docker run --rm load
